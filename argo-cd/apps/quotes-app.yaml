apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quotes-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: demo-app
    server: https://kubernetes.default.svc
    # kustomize:
    #   namePrefix: quotes-
    #   nameSuffix: -app
  source:
    path: k8s/overlays/local
    repoURL: https://github.com/pratheeshrussell/exploring_kubernetes
    targetRevision: argo-cd-setup
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true